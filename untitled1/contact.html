<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于我们 - 在线教育平台</title>
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/contact.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <div
          style="
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 60px;
          "
        >
          <div class="logo">Logo</div>
          <ul class="nav">
            <li><a href="/home.html">首页</a></li>
            <li>
              <a href="#">服务</a>
              <ul>
                <li><a href="#">考研集训</a></li>
                <li><a href="#">报考咨询</a></li>
              </ul>
            </li>
            <li><a href="/contact.html">联系</a></li>
            <li>
              <a href="#">关于</a>
              <ul>
                <li><a href="/about.html">企业简介</a></li>
                <li><a href="/teacher.html">讲师团队</a></li>
              </ul>
            </li>
          </ul>
        </div>
        <div class="search-user">
          <label>
            <input
              type="text"
              class="search-box"
              placeholder="请输入您想查询的内容"
            />
          </label>
          <div class="user-avatar"></div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="feature-section">
        <div class="feature">
          <div class="feature-circle">
            <img src="/image/icon/dr.svg" width="32" alt="优势1" />
          </div>
          <p>顶尖的师资团队</p>
        </div>
        <div class="feature">
          <div class="feature-circle">
            <img src="/image/icon/score.svg" width="32" alt="优势2" />
          </div>
          <p>全套的提分体系</p>
        </div>
        <div class="feature">
          <div class="feature-circle">
            <img src="/image/icon/kefu.svg" width="32" alt="优势3" />
          </div>
          <p>完善的售后服务</p>
        </div>
        <div class="feature">
          <div class="feature-circle">
            <img src="/image/icon/price.svg" width="32" alt="优势4" />
          </div>
          <p>亲民的课程价格</p>
        </div>
      </div>

      <div class="contact-form">
        <h2>联系我们</h2>
        <form action="#" method="post">
          <div class="form-row">
            <div class="form-group">
              <input type="text" name="name" placeholder="姓名" required />
            </div>
            <div class="form-group">
              <input
                type="email"
                name="email"
                placeholder="Email 地址"
                required
              />
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 15px">
            <input type="text" name="subject" placeholder="邮件主题" required />
          </div>
          <div class="form-group" style="margin-bottom: 15px">
            <textarea
              name="message"
              rows="5"
              placeholder="邮件内容"
              required
            ></textarea>
          </div>
          <button type="submit">点击发送电子邮件</button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-sections">
          <div class="footer-section">
            <h3>关于我们</h3>
            <p>
              在线教育平台致力于为用户提供优质的在线学习资源，连接世界各地的学者和学生，创造无限学习机会。
            </p>
          </div>
          <div class="footer-section">
            <h3>联系我们</h3>
            <p>Email: contact@example.com</p>
            <p>电话: +86 123 456 7890</p>
            <p>地址: 中国北京市中关村大道1号</p>
          </div>
          <div class="footer-section">
            <h3>关注我们</h3>
            <div class="social-media">
              <a href="#"
                ><img src="/image/facebook.svg" alt="facebook" width="16"
              /></a>
              <a href="#"><img src="/image/qq.svg" alt="qq" width="16" /></a>
              <a href="#"
                ><img src="/image/weibo.svg" alt="weibo" width="16"
              /></a>
              <a href="#"
                ><img src="/image/weixin.svg" alt="weixin" width="16"
              /></a>
            </div>
          </div>
        </div>
        <div class="footer-bottom">
          <p>© 2024 在线教育平台. 保留所有权利。</p>
        </div>
      </div>
    </footer>

    <script type="text/javascript" src="/js/home.js"></script>
  </body>
</html>
